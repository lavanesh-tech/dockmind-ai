# Local infrastructure for running DockMind on your machine.
#   cp .env.example .env    # then set a password in .env (never commit .env)
#   docker compose up -d                      # infrastructure only: databases, Kafka, Redis
#   ./mvnw package -DskipTests && docker compose --profile app up -d --build   # plus the three services
# Tests do not need this: they start their own throwaway containers with Testcontainers.
# Each service owns its own database; nothing is shared between them.

services:
  shipment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipment
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this machine
    volumes:
      - shipment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shipment"]
      interval: 5s
      timeout: 3s
      retries: 10

  dock-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dock
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dock-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d dock"]
      interval: 5s
      timeout: 3s
      retries: 10

  recovery-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - recovery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d recovery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Fine for local development only.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for apps on your machine (localhost:9092), INTERNAL for other containers (kafka:19092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Rate-limit buckets for the gateway.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # ---- Application services (profile "app") ----
  # Calling /api/v1 end to end needs tokens from an identity provider; Keycloak is added in M6.
  shipment-service:
    profiles: ["app"]
    build: ./shipment-service
    environment:
      DB_URL: jdbc:postgresql://shipment-db:5432/shipment
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
    depends_on:
      shipment-db: { condition: service_healthy }
      kafka: { condition: service_started }
    ports:
      - "127.0.0.1:8081:8081"

  dock-scheduling-service:
    profiles: ["app"]
    build: ./dock-scheduling-service
    environment:
      DB_URL: jdbc:postgresql://dock-db:5432/dock
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
    depends_on:
      dock-db: { condition: service_healthy }
      kafka: { condition: service_started }
    ports:
      - "127.0.0.1:8082:8082"

  disruption-recovery-service:
    profiles: ["app"]
    build: ./disruption-recovery-service
    environment:
      DB_URL: jdbc:postgresql://recovery-db:5432/recovery
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
    depends_on:
      recovery-db: { condition: service_healthy }
      dock-scheduling-service: { condition: service_started }
    ports:
      - "127.0.0.1:8083:8083"

  ai-operations-service:
    profiles: ["app"]
    build: ./ai-operations-service
    environment:
      # From your local .env only. Without a key the assistant answers 503; everything else still works.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      RECOVERY_SERVICE_URI: http://disruption-recovery-service:8083
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
    depends_on:
      - dock-scheduling-service
      - disruption-recovery-service
    ports:
      - "127.0.0.1:8084:8084"

  api-gateway:
    profiles: ["app"]
    build: ./api-gateway
    environment:
      SHIPMENT_SERVICE_URI: http://shipment-service:8081
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      REDIS_HOST: redis
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
    depends_on:
      - redis
      - shipment-service
      - dock-scheduling-service
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  shipment-db-data:
  dock-db-data:
  recovery-db-data:
  kafka-data:
