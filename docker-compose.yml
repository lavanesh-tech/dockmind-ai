# Local infrastructure for running DockMind on your machine.
#   cp .env.example .env    # then set a password in .env (never commit .env)
#   docker compose up -d                      # infrastructure only: databases, Kafka, Redis
#   ./scripts/run-local.sh                    # everything: builds, starts all services, Keycloak and the web app
# Tests do not need this: they start their own throwaway containers with Testcontainers.
# Each service owns its own database; nothing is shared between them.

services:
  shipment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipment
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"   # only reachable from this machine; 15432 avoids clashing with a local PostgreSQL
    volumes:
      - shipment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shipment"]
      interval: 5s
      timeout: 3s
      retries: 10

  dock-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dock
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - dock-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d dock"]
      interval: 5s
      timeout: 3s
      retries: 10

  recovery-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: ${DB_USERNAME:-dockmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - recovery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d recovery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Login (OpenID Connect). Imports the DockMind realm: roles, tenant claim, demo users.
  # Admin console: http://localhost:8180 (KC_ADMIN_PASSWORD from .env). Dev mode: local use only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
      DOCKMIND_SMOKE_CLIENT_SECRET: ${DOCKMIND_SMOKE_CLIENT_SECRET:?Set DOCKMIND_SMOKE_CLIENT_SECRET in .env}
    volumes:
      - ./keycloak/realm-dockmind.json:/opt/keycloak/data/import/realm-dockmind.json:ro
    ports:
      - "127.0.0.1:8180:8080"

  # Observability in one container (local use only): OpenTelemetry collector, Prometheus,
  # Tempo (traces), Loki and Grafana. Grafana: http://localhost:13000 (admin / admin).
  observability:
    image: grafana/otel-lgtm:0.38.0
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./observability/dockmind-dashboard.json:/otel-lgtm/dockmind-dashboard.json:ro
    ports:
      - "127.0.0.1:13000:3000"   # Grafana
      - "127.0.0.1:19090:9090"   # Prometheus

  # Single-node Kafka in KRaft mode (no ZooKeeper). Fine for local development only.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for apps on your machine (localhost:9092), INTERNAL for other containers (kafka:19092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Rate-limit buckets for the gateway.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # ---- Application services (profile "app") ----
  # Calling /api/v1 end to end needs tokens from an identity provider; Keycloak is added in M6.
  shipment-service:
    profiles: ["app"]
    build: ./shipment-service
    environment:
      DB_URL: jdbc:postgresql://shipment-db:5432/shipment
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
      # Tokens say they come from localhost:8180 (what the browser sees); keys are fetched over the Docker network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dockmind/protocol/openid-connect/certs
      # Traces go to the observability container (OpenTelemetry collector -> Tempo).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://observability:4318/v1/traces
    depends_on:
      shipment-db: { condition: service_healthy }
      kafka: { condition: service_started }
    ports:
      - "127.0.0.1:18081:8081"

  dock-scheduling-service:
    profiles: ["app"]
    build: ./dock-scheduling-service
    environment:
      DB_URL: jdbc:postgresql://dock-db:5432/dock
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
      # Tokens say they come from localhost:8180 (what the browser sees); keys are fetched over the Docker network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dockmind/protocol/openid-connect/certs
      # Traces go to the observability container (OpenTelemetry collector -> Tempo).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://observability:4318/v1/traces
    depends_on:
      dock-db: { condition: service_healthy }
      kafka: { condition: service_started }
    ports:
      - "127.0.0.1:18082:8082"

  disruption-recovery-service:
    profiles: ["app"]
    build: ./disruption-recovery-service
    environment:
      DB_URL: jdbc:postgresql://recovery-db:5432/recovery
      DB_USERNAME: ${DB_USERNAME:-dockmind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
      # Tokens say they come from localhost:8180 (what the browser sees); keys are fetched over the Docker network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dockmind/protocol/openid-connect/certs
      # Traces go to the observability container (OpenTelemetry collector -> Tempo).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://observability:4318/v1/traces
    depends_on:
      recovery-db: { condition: service_healthy }
      dock-scheduling-service: { condition: service_started }
    ports:
      - "127.0.0.1:18083:8083"

  ai-operations-service:
    profiles: ["app"]
    build: ./ai-operations-service
    environment:
      # From your local .env only. Without a key the assistant answers 503; everything else still works.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      RECOVERY_SERVICE_URI: http://disruption-recovery-service:8083
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
      # Tokens say they come from localhost:8180 (what the browser sees); keys are fetched over the Docker network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dockmind/protocol/openid-connect/certs
      # Traces go to the observability container (OpenTelemetry collector -> Tempo).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://observability:4318/v1/traces
    depends_on:
      - dock-scheduling-service
      - disruption-recovery-service
    ports:
      - "127.0.0.1:18084:8084"

  api-gateway:
    profiles: ["app"]
    build: ./api-gateway
    environment:
      SHIPMENT_SERVICE_URI: http://shipment-service:8081
      DOCK_SERVICE_URI: http://dock-scheduling-service:8082
      RECOVERY_SERVICE_URI: http://disruption-recovery-service:8083
      AI_SERVICE_URI: http://ai-operations-service:8084
      REDIS_HOST: redis
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dockmind}
      # Tokens say they come from localhost:8180 (what the browser sees); keys are fetched over the Docker network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dockmind/protocol/openid-connect/certs
      # Traces go to the observability container (OpenTelemetry collector -> Tempo).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://observability:4318/v1/traces
    depends_on:
      - redis
      - keycloak
      - shipment-service
      - dock-scheduling-service
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  shipment-db-data:
  dock-db-data:
  recovery-db-data:
  kafka-data:
