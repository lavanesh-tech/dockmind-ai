spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/dockmind}

server:
  port: ${SERVER_PORT:8080}

dockmind:
  gateway:
    shipment-uri: ${SHIPMENT_SERVICE_URI:http://localhost:8081}
    dock-uri: ${DOCK_SERVICE_URI:http://localhost:8082}
    recovery-uri: ${RECOVERY_SERVICE_URI:http://localhost:8083}
    ai-uri: ${AI_SERVICE_URI:http://localhost:8084}
    # Longest a caller waits for a backend before getting a 503.
    timeout: ${GATEWAY_TIMEOUT:3s}
    # Recovery planning and AI answers can take longer (an LLM reply can take tens of seconds).
    long-timeout: ${GATEWAY_LONG_TIMEOUT:60s}
    rate-limit:
      # Token bucket per tenant: refills this many requests per second, allows bursts up to burst-capacity.
      replenish-rate: ${RATE_LIMIT_PER_SECOND:20}
      burst-capacity: ${RATE_LIMIT_BURST:40}

management:
  metrics:
    tags:
      # Lets dashboards group and filter by service.
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Prometheus can compute p50/p95/p99 latency.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request is traced locally; production would sample (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        # Metrics are pulled by Prometheus from /actuator/prometheus; only traces are pushed (OTLP).
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:-}]"
