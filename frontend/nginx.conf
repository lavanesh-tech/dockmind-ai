# Serves the Angular app. /api and Keycloak paths are routed by the load balancer, not here.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Security headers for the single-page app.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Hashed bundles can be cached forever; index.html never.
    location ~* \.(js|css|woff2?|ico|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
