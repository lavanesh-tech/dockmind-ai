spring:
  application:
    name: dock-scheduling-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/dock}
    username: ${DB_USERNAME:dockmind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # Forward compatibility: producers may add event fields; this consumer ignores ones it doesn't know.
      fail-on-unknown-properties: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dock-scheduling
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/dockmind}

server:
  port: ${SERVER_PORT:8082}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  metrics:
    tags:
      # Lets dashboards group and filter by service.
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Prometheus can compute p50/p95/p99 latency.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request is traced locally; production would sample (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        # Metrics are pulled by Prometheus from /actuator/prometheus; only traces are pushed (OTLP).
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"
