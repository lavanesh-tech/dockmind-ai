spring:
  application:
    name: disruption-recovery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15434/recovery}
    username: ${DB_USERNAME:dockmind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/dockmind}

dockmind:
  recovery:
    dock-scheduling-url: ${DOCK_SERVICE_URI:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
    # Plans that move more appointments than this need an ADMIN to approve. Dock Scheduling enforces the same rule.
    admin-approval-moved-threshold: 3

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  metrics:
    tags:
      # Lets dashboards group and filter by service.
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Prometheus can compute p50/p95/p99 latency.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request is traced locally; production would sample (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        # Metrics are pulled by Prometheus from /actuator/prometheus; only traces are pushed (OTLP).
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"
