spring:
  application:
    name: disruption-recovery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/recovery}
    username: ${DB_USERNAME:dockmind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/dockmind}

dockmind:
  recovery:
    dock-scheduling-url: ${DOCK_SERVICE_URI:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
    # Plans that move more appointments than this need an ADMIN to approve. Dock Scheduling enforces the same rule.
    admin-approval-moved-threshold: 3

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"
