spring:
  application:
    name: shipment-service
  datasource:
    # No default password: it must come from the environment (.env locally, a secrets manager in AWS).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipment}
    username: ${DB_USERNAME:dockmind}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it, and fails startup if not.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # Ignore unknown JSON fields (e.g. a "tenantId" a client tries to sneak in) instead of failing.
      fail-on-unknown-properties: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas, and let the broker drop duplicate retries (idempotent producer).
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when Kafka is down, so the relay retries later instead of hanging.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be signed by this issuer's keys and carry this "iss" claim.
          # Spring fetches the issuer's public keys lazily, on the first request with a token.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/dockmind}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8081}
  error:
    # Never leak internals through Spring Boot's fallback error page.
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Only expose what operators and load balancers need. /env, /beans etc. stay hidden.
        include: health,info
  endpoint:
    health:
      show-details: never
      # Adds /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true

logging:
  pattern:
    # Every log line carries the service name and the request's correlation ID.
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"
